name: (ATfE) picolibc-main

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # Every day at 03:00 UTC

concurrency:
  group: atfe-picolibc-main
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ah-ubuntu_22_04-c7g_8x-100
    timeout-minutes: 360
    if: github.repository == 'arm/arm-toolchain'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: ./arm-software/embedded/scripts/install_dependencies.sh

      - name: Add ~/.local/bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Apply llvm-project patches
        run: python3 arm-software/embedded/cmake/patch_repo.py --method apply arm-software/embedded/patches/llvm-project

      - name: Apply llvm-project-perf patches
        run: python3 arm-software/embedded/cmake/patch_repo.py --method apply arm-software/embedded/patches/llvm-project-perf

      - name: Build with picolibc main
        run: |
          set -o pipefail
          ./arm-software/embedded/scripts/build_picolibc_main.sh 2>&1 | tee build.log

      - name: Test
        run: |
          set -o pipefail
          ./arm-software/embedded/scripts/test_picolibc_main.sh 2>&1 | tee test.log

      - name: Upload logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-picolibc-main
          path: |
            build.log
            test.log

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-picolibc-main
          path: build/multilib-picolibc-builds/**/lit_results.junit.xml

      - name: Upload package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ATfE-picolibc-main
          path: build/atfe_packages/ATfE-*.tar.xz
