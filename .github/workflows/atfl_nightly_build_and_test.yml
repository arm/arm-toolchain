# This workflow runs all build scripts in parallel for multiple operating
# systems and architectures.
# It is intended to be triggered as part of a **nightly build** to
# validate all build configurations and test them automatically.
#
# Each build script is paired with a corresponding test script using
# a matrix strategy. Each build+test pair runs as a separate job,
# allowing for concurrency and clear traceability of failures.

name: ATfL Nightly Build and Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # Every day at 06:00 UTC

jobs:
  build-and-test-toolchain:
    name: Build ${{ matrix.build_script }} for ${{ matrix.target_os }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    # Ensure the workflow only runs on the arm-toolchain repository and not on forks
    if: github.repository == 'arm/arm-toolchain'

    strategy:
      fail-fast: false  # Prevents one job failure from cancelling all
      matrix:
        include:
          # Complete Toolchain Build & Test
          - build_script: build.sh
            install_script: install_dependencies_ubuntu.sh
            target_os: Ubuntu-22.04-arm64
            runner: ah-ubuntu_22_04-c7g_8x-100

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add ~/.local/bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: ./arm-software/linux/scripts/${{ matrix.install_script }}

      - name: Install packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm ruby-full rubygems dpkg-dev debhelper gettext-base
          command -v envsubst
          envsubst --version

      - name: Install fpm
        run: sudo gem install --no-document fpm

      - name: Clean previous artifacts
        run: rm -rf arm-software/linux/output arm-software/linux/build

      - name: Build (Unix)
        shell: bash
        run: |
          set -o pipefail # ensure failure is propagated even when piping to tee
          ./arm-software/linux/${{ matrix.build_script }} 2>&1 | tee build.log

      - name: Create deb package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          WORKDIR="${GITHUB_WORKSPACE}/arm-software/linux/output"
          cd "$WORKDIR"

          PRODUCT_NAME="arm-toolchain-for-linux"
          PACKAGE_BRANCH_VERSION="0.0"
          PACKAGE_BUILD_NUMBER="0"
          PACKAGE_NAME="${PRODUCT_NAME}-${PACKAGE_BRANCH_VERSION}-${PACKAGE_BUILD_NUMBER}"
          DISTRO="ubuntu-22"
          DISTRO_TAG="jammy"
          PACK_DATE="$(date -R)"
          DPKG_BINARY_DIR="${PRODUCT_NAME}-${PACKAGE_BRANCH_VERSION}"

          export PRODUCT_NAME PACKAGE_BRANCH_VERSION PACKAGE_BUILD_NUMBER
          export PACKAGE_NAME DISTRO DISTRO_TAG PACK_DATE DPKG_BINARY_DIR

          PKG_DIR="$WORKDIR/$PACKAGE_NAME/DEB/$DPKG_BINARY_DIR"

          rm -rf "$WORKDIR/$PACKAGE_NAME"
          mkdir -p "$PKG_DIR"

          tarballs=(atfl-*.tar.gz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one atfl-*.tar.gz, found ${#tarballs[@]}"
            exit 1
          fi
          tarball="${tarballs[0]}"
          echo "tarball: $tarball"

          sudo mkdir -p /opt/arm
          sudo rm -rf "/opt/arm/$PRODUCT_NAME"

          sudo tar -xzf "$tarball" -C /opt/arm

          if [ -d "/opt/arm/atfl" ]; then
            sudo mv "/opt/arm/atfl" "/opt/arm/$PRODUCT_NAME"
          fi

          if [ ! -f "/opt/arm/$PRODUCT_NAME/arm/mkmoduledirs.sh" ]; then
            echo "Expected extracted toolchain under /opt/arm/$PRODUCT_NAME"
            exit 1
          fi

          sudo sed -i \
            -e "s/^ATFL_VERSION=.*$/ATFL_VERSION=${PACKAGE_BRANCH_VERSION}/" \
            -e "s/^ATFL_BUILD=.*$/ATFL_BUILD=${PACKAGE_BUILD_NUMBER}/" \
            -e "s|^ATFL_INSTALL_PREFIX=.*$|ATFL_INSTALL_PREFIX=/opt/arm/${PRODUCT_NAME}|" \
            "/opt/arm/$PRODUCT_NAME/arm/mkmoduledirs.sh"

          (
            umask 022
            cd /opt/arm
            sudo "./$PRODUCT_NAME/arm/mkmoduledirs.sh"
          )

          LLVM_HOST_TRIPLE="aarch64-unknown-linux-gnu"

          if [ -f /opt/arm/arm-performance-libraries/lib/libamath.so ] && \
             [ -f /opt/arm/arm-performance-libraries/lib/libamath.a ]; then
            sudo ln -sfn /opt/arm/arm-performance-libraries/lib/libamath.so \
              "/opt/arm/$PRODUCT_NAME/lib/$LLVM_HOST_TRIPLE/libamath.so"
            sudo ln -sfn /opt/arm/arm-performance-libraries/lib/libamath.a \
              "/opt/arm/$PRODUCT_NAME/lib/$LLVM_HOST_TRIPLE/libamath.a"
          else
            echo "Arm Performance Libraries not present; skipping libamath symlinks"
          fi

          mkdir -p "$WORKDIR/$PACKAGE_NAME/DEB"
          mkdir -p "$PKG_DIR/opt"
          sudo cp -a /opt/arm "$PKG_DIR/opt/"

          cp -r "${GITHUB_WORKSPACE}/arm-software/linux/scripts/packaging/debian" \
            "$WORKDIR/$PACKAGE_NAME/DEB"

          for srcctl in changelog control rules; do
            envsubst < "$WORKDIR/$PACKAGE_NAME/DEB/debian/${srcctl}.in" \
              > "$WORKDIR/$PACKAGE_NAME/DEB/debian/${srcctl}"
          done

          cd "$WORKDIR/$PACKAGE_NAME/DEB"
          dpkg-buildpackage -us -uc --build=binary

      - name: List built artifacts
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          find arm-software/linux/output -maxdepth 3 -type f \( -name '*.tar.gz' -o -name '*.deb' \) | sort

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: ${{ always() && env.ACT != 'true' }}
        with:
          name: build-log-${{ matrix.target_os }}
          path: build.log
          if-no-files-found: warn

      - name: Upload built packages
        uses: actions/upload-artifact@v4
        if: ${{ success() && env.ACT != 'true' }}
        with:
          name: atfl-${{ matrix.build_script }}-${{ matrix.target_os }}
          path: |
            arm-software/linux/output/atfl-*.tar.gz
            arm-software/linux/output/**/*.deb

