ifndef BIN_PATH
    BIN_PATH=../../../bin
endif

ifndef LIBC
    LIBC=picolibc
endif

MICROBIT_TARGET=--target=armv6m-none-eabi -march=armv6m -mfpu=none -mfloat-abi=soft
AARCH64_TARGET=--target=aarch64-none-elf

MICROBIT_OPTIONS=$(MICROBIT_TARGET) --config=Osize.cfg

CRT_SEMIHOST=-nostartfiles -lcrt0-semihost -lsemihost

CPP_FLAGS=-fno-exceptions -fno-rtti

ifeq ($(LIBC),picolibc)
    CFG_FILE=
    MATH_LIB=
    LIBC_LD_FILE=picolibcpp.ld
else ifeq ($(LIBC),llvmlibc)
    CFG_FILE=--config=llvmlibc.cfg
    MATH_LIB=-lm
    LIBC_LD_FILE=llvmlibc.ld
else
    $(error Unsupported LIBC=$(LIBC))
endif

QEMU_SEMIHOSTING=-nographic \
-chardev stdio,mux=on,id=stdio0 \
-semihosting-config enable=on,chardev=stdio0 \
-monitor none -serial none
